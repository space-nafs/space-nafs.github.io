<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#121e33">
<title>ميقات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#121e33;--navy2:#1a2842;--navy3:#22324f;--navyline:#2b3c5c;
  --cream:#eceef1;--card:#fff;--line:#eee8dc;--ink:#1b2333;--muted:#8b8f98;--muted2:#a9adb5;
  --gold:#7f91a8;--gold2:#aebccc;--goldsoft:#e3e8ef;--goldink:#4e6079;
  --green:#3dbb8a;--greensoft:#e2f4ec;
  --ui:'IBM Plex Sans Arabic',system-ui,sans-serif;--num:'Inter','IBM Plex Sans Arabic',sans-serif;
  --disp:'Aref Ruqaa','Amiri',serif;--quran:'Amiri',serif;--mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0b1322;font-family:var(--ui);color:var(--ink);display:flex;justify-content:center;align-items:center;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#phone{position:relative;width:100%;height:100%;overflow:hidden;background:var(--cream)}
@media (min-width:520px){
  #phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 10px #1c2a44,0 30px 80px #0008}
  #sbar{display:flex!important}
}
#sbar{display:none;position:absolute;top:0;left:0;right:0;height:44px;padding:0 26px;align-items:center;justify-content:space-between;font:600 14px var(--num);z-index:50;pointer-events:none;direction:ltr}
#sbar svg{width:16px;height:16px;fill:currentColor}
#screen{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pt{padding-top:env(safe-area-inset-top)}
@media (min-width:520px){.pt{padding-top:44px}}
.light{background:var(--cream);color:var(--ink)}
.dark{background:var(--navy);color:#fff}

/* nav */
.nav{display:flex;justify-content:space-around;padding:8px 6px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--cream)}
.dark .nav{background:var(--navy2);border-color:var(--navyline)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted2);width:72px}
.nav button .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.nav button.on{color:var(--ink);font-weight:700}
.nav button.on .pill{background:var(--goldsoft);color:var(--goldink)}
.dark .nav button.on{color:#fff}
.dark .nav button.on .pill{background:#2e3d5a;color:var(--gold2)}
@media (min-width:520px){.nav{padding-bottom:22px}}

/* generic */
.hdr{display:flex;align-items:center;gap:12px;padding:12px 20px 8px}
.hdr h1{font:700 26px var(--disp);flex:1}
.ib{width:40px;height:40px;border-radius:20px;display:grid;place-items:center}
.card{background:var(--card);border-radius:18px;border:1px solid var(--line)}
.dark .card{background:var(--navy2);border-color:var(--navyline)}
.btn{height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:16px;width:100%}
.btn.gold{background:linear-gradient(180deg,#61778f,#526780);color:#fff;box-shadow:none}
.btn.navy{background:var(--navy);color:#fff}
.btn.white{background:#fff;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;font-size:12.5px;font-weight:600;white-space:nowrap}
.muted{color:var(--muted)}
.sec{font-size:13px;color:var(--muted);font-weight:600;margin:18px 22px 8px}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:#1b2333ee;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:90;max-width:85%;text-align:center;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translate(-50%,8px)}}

/* splash */
.splash{background:radial-gradient(circle at 50% 42%,#1f2d47 0,#121e33 45%,#0d1628 100%);color:#fff;align-items:center;justify-content:center;text-align:center}
.splash .t{font:700 64px var(--disp);color:var(--gold2);margin-top:22px}
.splash .s{color:#b8bfcc;font-size:14px;margin-top:6px}
.dots{display:flex;gap:7px;justify-content:center;margin-top:46px}
.dots i{width:7px;height:7px;border-radius:4px;background:#4a5670;animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{40%{background:var(--gold2)}}
.splash .foot{position:absolute;bottom:46px;left:0;right:0;font-size:12px;color:#6f7a90}

/* onboarding */
.prog{display:flex;gap:6px;padding:14px 22px 0}
.prog i{flex:1;height:4px;border-radius:2px;background:#dce1e7}.prog i.on{background:var(--gold)}
.ob h2{font:700 34px var(--disp);padding:18px 22px 4px}
.ob p.lead{padding:0 22px;color:var(--muted);font-size:13.5px}
.search{display:flex;align-items:center;gap:10px;margin:0 22px;height:56px;padding:0 16px;border-radius:16px;background:#fff;border:1.5px solid var(--gold2)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15px}
.list{margin:10px 22px 0;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);text-align:right;width:100%}
.li:last-child{border-bottom:0}
.li .tx{flex:1}.li b{display:block;font-size:15px}.li small{color:var(--muted);font-size:12px}
.radio{width:22px;height:22px;border-radius:11px;display:grid;place-items:center;color:#fff}
.radio.on{background:var(--navy)}
.seg{display:flex;background:#e2e6eb;border-radius:14px;padding:4px;margin:0 22px}
.seg button{flex:1;height:40px;border-radius:11px;font-size:13.5px;color:var(--muted);font-weight:600}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0001}

/* home hero */
.hero{position:relative;color:#fff;padding:0 22px 26px;overflow:hidden}
.hero.day{background:linear-gradient(180deg,#6d8099 0%,#a6968f 55%,#e0a46c 100%)}
.hero.night{background:linear-gradient(180deg,#0f1a2e 0%,#1c2b47 100%)}
.hero .deco{position:absolute;left:-70px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px dashed #ffffff30}
.hero .moon{position:absolute;left:18px;top:30px;width:76px;height:76px;border-radius:50%;box-shadow:-14px 10px 0 0 #dfe3ea;transform:rotate(-20deg)}
.hero .loc{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px;justify-content:flex-start}
.hero .date{font-size:12.5px;opacity:.9;margin-top:3px}
.hero .lbl{font-size:13px;opacity:.9;margin-top:26px;text-align:right}
.hero .cd{font:800 58px var(--num);letter-spacing:-1px;text-align:right;direction:ltr;line-height:1.05;font-variant-numeric:tabular-nums}
.hero .ap{display:inline-flex;align-items:center;gap:6px;background:#ffffff2e;border-radius:18px;padding:6px 12px;font-size:13.5px;font-weight:600;margin-top:10px}
.hero .apw{text-align:right}
.calbtn{position:absolute;left:22px;top:12px;width:40px;height:40px;border-radius:20px;background:#ffffff26;display:grid;place-items:center;z-index:2}
.offbar{margin:14px 16px 0;padding:12px 14px;border-radius:14px;background:#e9edf2;border:1px solid #d6dde6;display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:#4a5a6e;line-height:1.7}
.plist{margin:-14px 16px 0;position:relative;z-index:3;overflow:hidden;padding:4px 0}
.prow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);position:relative}
.prow:last-child{border-bottom:0}
.dark .prow{border-color:var(--navyline)}
.prow .ic{width:38px;height:38px;border-radius:12px;background:#e9ecf0;display:grid;place-items:center;color:#7d8597}
.dark .prow .ic{background:#24344f;color:#b7c0d2}
.prow .nm{font-size:16px;font-weight:600}.prow .sb{font-size:11.5px;color:var(--muted)}
.prow .tm{font:600 19px var(--num);min-width:58px;text-align:left;color:var(--ink)}
.dark .prow .tm{color:#fff}
.prow.past .tm{color:#9aa0aa}.dark .prow.past .tm{color:#9aa6bb}
.prow .ck{width:20px;height:20px;border-radius:10px;background:var(--greensoft);color:var(--green);display:grid;place-items:center}
.dark .prow .ck{background:#1f4a44}
.prow .bell{color:var(--gold);width:30px;display:grid;place-items:center}
.prow .bell.off{color:#b5b9c1}
.prow.next{background:var(--goldsoft);margin:0 -2px;border-radius:14px;border-bottom-color:transparent}
.dark .prow.next{background:#2c3a55}
.prow.next .ic{background:var(--gold);color:#fff}
.prow.next .sb{color:var(--goldink)}.dark .prow.next .sb{color:var(--gold2)}
.prow.next .nm{font-weight:700}.prow.next .tm{font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 16px 18px}
.tile{display:flex;align-items:center;gap:12px;padding:16px;text-align:right}
.tile .ti{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.tile b{display:block;font-size:14.5px;white-space:nowrap}.tile small{color:var(--muted);font-size:12px}

/* timings day */
.daybar{margin:6px 16px 0;background:var(--navy);color:#fff;border-radius:20px;padding:14px;display:flex;align-items:center;text-align:center}
.daybar .c{flex:1}.daybar b{font-size:16px}.daybar small{display:block;color:var(--gold2);font-size:12.5px;margin-top:2px}
.trow{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.trow:last-child{border:0}
.trow .n{flex:1;font-size:15px;color:#6a707b}.trow .e{font:11.5px var(--mono);color:#a3a7ae;width:100px;text-align:left}
.trow .t{font:500 18px var(--num);color:#7b818b;width:56px;text-align:left}
.trow.p .n{color:var(--ink);font-weight:700}.trow.p .t{color:var(--ink);font-weight:700}
.trow.now{background:var(--goldsoft)}
.info{display:flex;gap:10px;padding:16px;margin:14px 16px;font-size:12.5px;line-height:1.8;color:#555b66}

/* imsakiya */
.mhead{display:flex;align-items:center;gap:8px;padding:0 16px;margin-top:4px}
.mrow{display:grid;grid-template-columns:1.35fr repeat(5,1fr);align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.mrow>span{text-align:center;font-family:var(--num);font-weight:500}
.mrow>.d{text-align:right;font-family:var(--ui)}
.mrow .d b{font-size:13.5px}.mrow .d small{display:block;font-size:10.5px;color:var(--muted)}
.mrow.h{font-size:12px;color:var(--muted);border:0;padding-top:16px}
.mrow.h>span{font-family:var(--ui);font-weight:500}
.mrow.today{background:var(--navy);color:#fff;border-radius:12px;margin:0 6px;border:0}
.mrow.today .d b{color:var(--gold2)}.mrow.today small{color:#b0b9cc}
.mrow.alt{background:#f2f4f6}

/* qibla */
.qhead{text-align:center;padding:10px 20px 0}
.qhead h3{font-size:21px;font-weight:700}.qhead p{font-size:12.5px;color:#9aa6bb;margin-top:4px}
.qhead.ok h3{color:#59d4a2}
.dialwrap{position:relative;width:310px;height:330px;margin:4px auto 0;touch-action:none}
.dialwrap .tri{position:absolute;left:50%;top:0;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:16px solid #fff;z-index:2}
.dialwrap.ok .tri{border-top-color:#59d4a2}
.dial{position:absolute;left:5px;top:20px;width:300px;height:300px}
.qstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 16px 0}
.qstats .card{padding:12px 14px;text-align:right}
.qstats small{font-size:11.5px;color:#9aa6bb}.qstats b{display:block;font:700 22px var(--num);margin-top:2px}
.qnote{display:flex;align-items:center;gap:10px;margin:10px 16px;padding:12px 14px;font-size:12px;color:#9aa6bb}
.simbar{margin:6px 16px;display:flex;align-items:center;gap:10px;font-size:12px;color:#9aa6bb}
.simbar input{flex:1;accent-color:var(--gold)}

/* adhan */
.adhan{background:linear-gradient(180deg,#2b3240 0%,#465264 50%,#5f6b7c 100%);color:#fff;text-align:center;align-items:center}
.adhan .pl{display:inline-flex;align-items:center;gap:6px;background:#ffffff26;border-radius:18px;padding:7px 14px;font-size:13px;font-weight:600;margin-top:22px}
.adhan .big{font:700 70px var(--disp);line-height:1.2;margin-top:6px}
.wave{display:flex;gap:4px;align-items:center;height:60px;justify-content:center;margin-top:34px}
.wave i{width:4px;border-radius:2px;background:#fff;opacity:.85;animation:wv 1s ease-in-out infinite}
@keyframes wv{50%{transform:scaleY(.35)}}
.adhan .bar{margin:0 18px;padding:14px 16px;border-radius:16px;background:#ffffff22;display:flex;align-items:center;gap:10px;font-size:13px;text-align:right}

/* lock reminder */
.lock{background:linear-gradient(180deg,#2c2a3e 0%,#3b3550 50%,#2c2a3e 100%);color:#fff}
.lock .clock{text-align:center;margin-top:34px}
.lock .clock small{font-size:15px;opacity:.9}.lock .clock b{display:block;font:300 92px var(--num);letter-spacing:-2px;line-height:1.05}
.notif{margin:20px 12px 0;background:#f2ecf1f2;color:var(--ink);border-radius:22px;padding:14px 16px;animation:drop .4s}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.notif .app{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#7a7f8a}
.notif .app i{width:20px;height:20px;border-radius:6px;background:var(--navy);display:grid;place-items:center;color:var(--gold2)}
.notif h4{font-size:15.5px;margin-top:8px}.notif p{font-size:13px;color:#555b66;margin-top:4px;line-height:1.7}
.notif .acts{display:flex;gap:8px;margin-top:12px}
.notif .acts button{flex:1;height:44px;border-radius:12px;font-weight:700;font-size:14px}

/* adhkar list */
.tabs{display:flex;gap:8px;padding:6px 16px 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs .okd{width:18px;height:18px;border-radius:9px;background:#6b7280;color:#fff;display:grid;place-items:center}
.aheroc{margin:0 16px;border-radius:22px;padding:18px;color:#fff}
.aheroc small{font-size:12px;opacity:.85}.aheroc h2{font:700 30px var(--disp);margin-top:2px}
.aheroc .st{display:flex;gap:16px;font-size:12.5px;margin-top:6px;opacity:.95}
.aheroc .st span{display:flex;align-items:center;gap:5px}
.aheroc .fp{margin-top:12px;background:#ffffff26;border-radius:14px;padding:8px 12px;font-size:12px;display:flex;align-items:center;gap:8px}
.arow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);width:100%;text-align:right}
.arow:last-child{border:0}
.arow .n{width:26px;height:26px;border-radius:9px;background:#e9ecf0;display:grid;place-items:center;font:600 12px var(--num);color:#6a707b}
.arow.dn .n{background:var(--greensoft);color:var(--green)}
.arow .tx{flex:1}.arow b{display:block;font-size:15px}.arow small{font-size:12px;color:var(--muted)}
.arow .x{font:700 14px var(--num);color:var(--goldink);direction:ltr}
.stickyb{position:sticky;bottom:0;padding:10px 16px 12px;background:linear-gradient(transparent,var(--cream) 30%)}

/* counter */
.chd{display:flex;align-items:center;padding:8px 16px 4px;text-align:center}
.chd .c{flex:1}.chd b{font-size:16px}.chd small{display:block;color:#8b97ad;font:500 12px var(--num)}
.segs{display:flex;gap:5px;padding:8px 18px 12px;direction:rtl}
.segs i{flex:1;height:3px;border-radius:2px;background:#33435f}
.segs i.d{background:var(--gold)}.segs i.c{background:#fff}
.dcard{margin:0 16px;background:#f6f7f9;color:var(--ink);border-radius:22px;padding:16px 18px 14px;cursor:pointer;user-select:none}
.dcard .tags{display:flex;gap:6px;justify-content:flex-start;flex-wrap:wrap}
.tg1{background:var(--navy);color:#fff}.tg2{background:var(--goldsoft);color:var(--goldink)}.tg3{background:var(--greensoft);color:#2a8a63}
.dtext{font-family:var(--quran);text-align:center;line-height:2;margin:12px 0 6px;color:#1b2333}
.dtext .sur{display:block;color:var(--goldink);font-size:.62em;font-weight:700;line-height:1.6}
.dtext .bas{display:block;font-size:.6em;color:#7a7f8a;line-height:1.6}
.dtext .ist{display:block;font-size:.6em;color:#7a7f8a}
.dnote{font-size:12.5px;color:#6a707b;text-align:center;padding:8px 0 0}
.dsrc{border-top:1px dashed #d6dbe2;margin-top:10px;padding-top:10px;display:flex;gap:8px;font-size:12px;color:#6a707b;line-height:1.7}
.dsrc .gn{color:var(--goldink);font-weight:700;display:block}
.fadl{margin:10px 16px 0;padding:12px 14px;border-radius:16px;background:#1d2b45;border:1px solid var(--navyline);font-size:12.5px;line-height:1.7;display:flex;gap:8px;color:#dfe5ef}
.fadl b{color:var(--gold2)}
.subchips{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.subchips .chip{height:32px;background:#1d2b45;color:#b9c3d6;border:1px solid var(--navyline);font-family:var(--ui)}
.subchips .chip.cur{background:var(--gold2);color:#ffffff;border-color:var(--gold2)}
.subchips .chip.ok{background:#173a36;color:#59d4a2;border-color:#1f4a44}
.ringw{display:flex;flex-direction:column;align-items:center;margin-top:auto;padding-top:14px}
.ring{position:relative;width:150px;height:150px;cursor:pointer;user-select:none;transition:transform .08s}
.ring:active{transform:scale(.96)}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:16px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#2a4270,#1a2b4c);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 2px 10px #0006}
.ring .in b{font:800 46px var(--num);line-height:1}.ring .in small{font-size:12.5px;color:#b9c3d6;margin-top:4px}
.hint{font-size:11.5px;color:#8b97ad;margin-top:10px;display:flex;align-items:center;gap:6px}
.cfoot{display:flex;justify-content:space-between;padding:14px 22px calc(14px + env(safe-area-inset-bottom));font-size:14px;color:#c9d1df}
.cfoot button{display:flex;align-items:center;gap:6px}
@media (min-width:520px){.cfoot{padding-bottom:26px}}

/* done */
.done{text-align:center}
.okbig{width:150px;height:150px;border-radius:50%;margin:40px auto 0;background:radial-gradient(circle,#1d3b44 55%,#16283f 56%);display:grid;place-items:center}
.okbig i{width:110px;height:110px;border-radius:50%;background:linear-gradient(180deg,#5a9a86,#447d6b);display:grid;place-items:center;box-shadow:none;animation:pop .5s}
@keyframes pop{from{transform:scale(.5)}}
.done h2{font:700 40px var(--disp);color:var(--gold2);margin-top:14px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 16px 0}
.stats3 .card{padding:12px 6px}.stats3 b{font:700 24px var(--num);display:block}.stats3 small{font-size:11.5px;color:#9aa6bb}
.pdots{display:flex;justify-content:space-between;padding:12px 6px 4px}
.pdots div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:#b9c3d6;flex:1}
.pdots i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#173a36;color:#59d4a2;border:1px solid #1f4a44}
.pdots i.no{background:transparent;border:1px dashed #44567a;color:#5d6d8d}

/* settings */
.srow{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line);width:100%;text-align:right}
.srow:last-child{border:0}
.srow .tx{flex:1}.srow b{display:block;font-size:15px;font-weight:600}.srow small{font-size:12px;color:var(--muted)}
.srow .ico{color:#5b6372}
.grp{margin:0 16px}
.tgl{width:50px;height:30px;border-radius:15px;background:#cfd5dd;position:relative;flex:none;transition:.2s}
.tgl::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
.tgl.on{background:#2f8d68}.tgl.on::after{right:23px}
.ncard{margin:0 16px 12px;padding:14px}
.ncard .top{display:flex;align-items:center;gap:10px}
.ncard .top .tx{flex:1;text-align:right}
.ncard .top b{font-size:16px}.ncard .top span{font:500 14px var(--num);color:var(--muted);margin-inline-start:6px}
.ncard .ops{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ncard .ops button{height:34px;padding:0 12px;border-radius:17px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.o1{background:var(--navy);color:#fff}.o2{background:#e9ecf0;color:#4b5260}.o3{background:var(--goldsoft);color:var(--goldink)}
.ncard.off .ops{opacity:.4;pointer-events:none}
.ncard .nt{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:center}

/* sheet */
.shade{position:absolute;inset:0;background:#0007;z-index:80;display:flex;align-items:flex-end;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sheet{width:100%;max-height:86%;background:var(--cream);color:var(--ink);border-radius:24px 24px 0 0;padding:10px 0 calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;animation:up .25s}
@keyframes up{from{transform:translateY(40px)}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#cfd5dd;margin:0 auto 10px}
.sheet h3{font-size:18px;padding:0 20px 10px}
.sheet .scroll{padding:0 16px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:17px;background:#fff;border:1px solid var(--line);font-size:18px;font-weight:700}
.stepper b{min-width:56px;text-align:center;font:600 15px var(--num)}

/* skeleton */
.sk{background:linear-gradient(90deg,#efe9dd,#f7f3ea,#efe9dd);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
.loglist{font:11px var(--mono);direction:ltr;text-align:left;color:#555;padding:10px 14px;line-height:1.7;word-break:break-all}
.loglist .ok{color:#2a8a63}.loglist .er{color:#c0392b}

/* home v2 */
.hero .loc{color:#fff;font-family:var(--ui)}
.hero .cd{cursor:pointer}.hero .cd.clk{opacity:.92}
button.ap{color:#fff;font-family:var(--ui)}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.2px 1.2px at 20% 30%,#fff9,transparent),radial-gradient(1px 1px at 60% 18%,#fff8,transparent),radial-gradient(1.4px 1.4px at 80% 40%,#fff7,transparent),radial-gradient(1px 1px at 35% 55%,#fff6,transparent),radial-gradient(1.2px 1.2px at 10% 70%,#fff7,transparent),radial-gradient(1px 1px at 90% 12%,#fff8,transparent),radial-gradient(1px 1px at 48% 8%,#fff9,transparent);pointer-events:none}
.arcw{margin:8px -10px -4px}
.arc{width:100%;height:auto;display:block;overflow:visible}
.arc .mk{cursor:pointer}
.sunp{animation:sunp 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sunp{50%{transform:scale(1.25);opacity:.75}}
.prow{flex-wrap:wrap;cursor:pointer;transition:background .2s}
.prow .ic{color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,#fff)}
.dark .prow .ic{color:color-mix(in srgb,var(--pc) 55%,#fff);background:color-mix(in srgb,var(--pc) 22%,#1a2842)}
.prow.next .ic{background:linear-gradient(160deg,#aebccc,#7f91a8);color:#fff;box-shadow:0 4px 12px #7f91a855}
.prow.next .ic svg{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.prow.open:not(.next){background:#faf7f0}.dark .prow.open:not(.next){background:#1f2f4c}
.prow .ck.gd{background:var(--goldsoft);color:var(--goldink)}.dark .prow .ck.gd{background:#3a4a60;color:var(--gold2)}
.xp{flex-basis:100%;padding:10px 50px 2px 0;animation:fade2 .2s}
@keyframes fade2{from{opacity:0;transform:translateY(-4px)}}
.xl{font-size:12.5px;color:#6a707b;display:flex;gap:6px;align-items:center;line-height:1.7}
.dark .xl{color:#b9c3d6}
.xl b{color:var(--ink)}.dark .xl b{color:#fff}
.pbar{height:6px;border-radius:3px;background:#0000000f;margin-top:8px;overflow:hidden}
.dark .pbar{background:#ffffff1a}
.pbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#7f91a8,#aebccc);margin-right:auto;margin-left:0;float:right}
.pmeta{display:flex;justify-content:space-between;font:11px var(--num);color:var(--muted);margin-top:4px}
.xa{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.xa button{display:flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:16px;font-size:12px;font-weight:600;background:#fff;border:1px solid var(--line);color:#4b5260}
.dark .xa button{background:#22324f;border-color:var(--navyline);color:#dfe5ef}
.xa button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.dark .xa button.on{background:#aebccc;color:#1b2333;border-color:#aebccc}
.xa button.gold{background:#526780;color:#fff;border:0}
.xa button.ok{background:var(--greensoft);color:#2a8a63;border-color:transparent}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 16px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .1s}
.qa button:active{transform:scale(.95)}
.dark .qa button{background:var(--navy2);border-color:var(--navyline)}
.qa span{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--b);color:var(--c);margin-bottom:4px}
.dark .qa span{background:color-mix(in srgb,var(--c) 25%,#1a2842);color:color-mix(in srgb,var(--c) 45%,#fff)}
.qa b{font-size:13px}.qa small{font-size:10.5px;color:var(--muted)}
.calbtn{top:calc(12px + env(safe-area-inset-top))}
@media (min-width:520px){.calbtn{top:56px}}

.mini{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;padding-left:18px;padding-right:18px;padding-bottom:10px;color:#fff;transform:translateY(-110%);transition:transform .25s ease;box-shadow:0 6px 20px #0003;cursor:pointer}
.mini:not(.pt){padding-top:10px}
.mini.pt{padding-top:calc(10px + env(safe-area-inset-top))}
@media (min-width:520px){.mini.pt{padding-top:50px}}
.mini.day{background:linear-gradient(180deg,#6d8099,#9a8f8c)}
.mini.night{background:linear-gradient(180deg,#0f1a2e,#1c2b47)}
.mini.show{transform:none}
.mini .mi{width:38px;height:38px;border-radius:12px;background:#ffffff2a;display:grid;place-items:center}
.mini .mt{flex:1;line-height:1.3}.mini .mt b{font-size:15px;display:block}.mini .mt small{font-size:11.5px;opacity:.85}
.mini~#hsc{padding-bottom:90px}
.mini .mc{font:800 26px var(--num);letter-spacing:-.5px;direction:ltr}

/* per-prayer skies */

/* prayer timeline card v3 */
.tl{margin:-14px 6px 0;position:relative;z-index:3;padding:16px 10px 10px;overflow:hidden;border-radius:22px}
.tr{padding:10px 8px 10px 6px!important}.tr.sun{padding-top:4px!important;padding-bottom:4px!important}.tr.next{padding-top:14px!important;padding-bottom:14px!important}
.tlh{display:flex;align-items:center;gap:10px;padding:0 4px 10px}
.tlh h3{margin:0;font-size:15px;font-weight:700}
.tlh small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.tlh .sg{display:flex;gap:4px;align-items:center;margin-right:auto}
.tlh .sg i{width:14px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--muted) 25%,transparent);transition:background .4s}
.tlh .sg i.on{background:#6f9a8a}
.tlh .sg b{font:600 12px var(--num);color:var(--muted);margin-right:4px}
.tr{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 6px 8px 4px;position:relative;cursor:pointer;border-radius:14px;transition:background .25s,transform .15s;animation:trin .45s both}
.tr:active{transform:scale(.985)}
@keyframes trin{from{opacity:0;transform:translateX(-14px)}}
.tl.noanim .tr{animation:none}
.rail{width:18px;align-self:stretch;position:relative;flex:none}
.rail:before{content:'';position:absolute;right:8px;width:2px;top:-8px;bottom:-8px;background:color-mix(in srgb,var(--muted) 22%,transparent);border-radius:1px}
.tr.f .rail:before{top:50%}.tr:last-child .rail:before{bottom:50%}
.rail .fl{position:absolute;right:8px;width:2px;top:-8px;background:color-mix(in srgb,var(--pc) 55%,#8a96a8);border-radius:1px;transition:height .6s}
.tr.f .rail .fl{top:50%}
.rail .dt{position:absolute;right:3px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--card);border:2px solid color-mix(in srgb,var(--muted) 40%,transparent);box-sizing:border-box}
.tr.past .rail .dt,.tr.sun.gone .rail .dt{background:color-mix(in srgb,var(--pc) 55%,#8a96a8);border-color:transparent}
.tr.next .rail .dt{border-color:var(--pc);background:var(--card);box-shadow:0 0 0 0 color-mix(in srgb,var(--pc) 40%,transparent);animation:ping 2.2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.rail .nw{position:absolute;right:5px;width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--pc) 70%,#6b7586);margin-top:-4px;transition:top .6s}
.tr .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;color:color-mix(in srgb,var(--pc) 80%,#555);background:color-mix(in srgb,var(--pc) 11%,var(--card));transition:transform .3s}
.tr .tx{flex:1;min-width:0}
.tr .nm{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.tr .sb{font-size:11.5px;color:var(--muted);margin-top:1px}
.tr .tm{font:600 18px var(--num);color:var(--ink)}
.tr.past .tm,.tr.past .nm{color:color-mix(in srgb,var(--ink) 50%,var(--card))}
.tr.past .ic{filter:saturate(.4);opacity:.75}
.tr .ac{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:#9aa3b5;flex:none;transition:transform .2s,background .3s,color .3s}
.tr .ac.off{color:color-mix(in srgb,var(--muted) 55%,transparent)}
.tr .ac.pr{border:1.6px dashed color-mix(in srgb,var(--muted) 45%,transparent);color:color-mix(in srgb,var(--muted) 70%,transparent)}
.tr .ac.pr.on{border:0;background:#6f9a8a;color:#fff;animation:pop .35s}
@keyframes pop{40%{transform:scale(1.22)}}
.tr.sun{padding-top:3px;padding-bottom:3px}
.tr.sun .ic{width:30px;height:30px;border-radius:10px;margin:0 5px}
.tr.sun .nm{font-size:13px;font-weight:500;color:var(--muted)}.tr.sun .tm{font-size:14px;color:var(--muted)}

/* ============ time helpers ============ */
const tz=()=>(G.day&&G.day.meta&&G.day.meta.timezone)||Intl.DateTimeFormat().resolvedOptions().timeZone;
function tzNow(){
  let parts;
  try{parts=new Intl.DateTimeFormat('en-GB',{timeZone:tz(),year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(Date.now()+OFFSET))}
  catch(e){parts=new Intl.DateTimeFormat('en-GB',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(Date.now()+OFFSET))}
  const o={};parts.forEach(p=>o[p.type]=p.value);
  const y=+o.year,m=+o.month,d=+o.day,h=+o.hour%24,mi=+o.minute,s=+o.second;
  return {y,m,d,h,mi,s,secs:h*3600+mi*60+s,key:`${y}-${pad(m)}-${pad(d)}`,api:`${pad(d)}-${pad(m)}-${y}`};
}
const pad=n=>String(n).padStart(2,'0');
const hm=t=>(t||'--:--').slice(0,5);
const toSec=t=>{const[a,b]=hm(t).split(':').map(Number);return a*3600+b*60};
const fmtCd=s=>{s=Math.max(0,s);return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`};
const addDays=(key,n)=>{const[y,m,d]=key.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d+n));return `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth()+1)}-${pad(dt.getUTCDate())}`};
const keyToApi=k=>{const[y,m,d]=k.split('-');return `${d}-${m}-${y}`};
const wdOf=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)).getUTCDay()};
function gDate(k){const[y,m,d]=k.split('-').map(Number);return `${WD[wdOf(k)]} ${d} ${GM[m-1]} ${y}`}
function hDate(day){const h=day&&day.date&&day.date.hijri;if(!h)return '';return `${+h.day} ${HM[h.month.number-1]} ${h.year}هـ`}
const isFriday=k=>wdOf(k)===5;

/* ============ API ============ */
function locParams(){
  const l=S.loc;const q={method:S.method,school:S.school,adjustment:S.hijriAdj};
  const t=S.tune;q.tune=[0,t.Fajr,0,t.Dhuhr,t.Asr,t.Maghrib,0,t.Isha,0].join(',');
  if(l&&l.type==='coords'){q.latitude=l.lat;q.longitude=l.lng}else q.address=l?l.address:'Algiers, Algeria';
  return q;
}
const byAddr=()=>!(S.loc&&S.loc.type==='coords');
function url(path,q){return API+path+'?'+Object.entries(q).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&')}
async function api(path,q,cacheKey){
  const u=url(path,q);const ck='c.'+(cacheKey||u);
  const t0=performance.now();
  try{
    if(FORCE_OFFLINE||!navigator.onLine)throw new Error('offline');
    const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),9000);
    const r=await fetch(u,{signal:ctl.signal});clearTimeout(tm);
    const j=await r.json();
    if(j.code!==200)throw new Error(typeof j.data==='string'?j.data:('HTTP '+j.code));
    LOG.unshift({ok:1,p:path.split('/')[0],ms:Math.round(performance.now()-t0),u});LOG.length=Math.min(LOG.length,12);
    LS.set(ck,{at:Date.now(),data:j.data});G.online=true;
    return {data:j.data,fresh:true};
  }catch(e){
    LOG.unshift({ok:0,p:path.split('/')[0],err:String(e.message||e),u});LOG.length=Math.min(LOG.length,12);
    const c=LS.get(ck,null);
    if(e.message!=='offline'&&!/abort|fetch|network|Load failed/i.test(e.message)&&!c)throw e;
    G.online=false;
    if(c)return {data:c.data,fresh:false,at:c.at};
    throw e;
  }
}
const G={day:null,tomorrow:null,next:null,month:{},online:true,cachedUntil:null};
const locKey=()=>JSON.stringify([S.loc&&(S.loc.address||[S.loc.lat,S.loc.lng]),S.method,S.school,S.tune,S.hijriAdj]);
async function getDay(k){
  const path=(byAddr()?'timingsByAddress/':'timings/')+keyToApi(k);
  try{return (await api(path,locParams(),'day.'+k+locKey())).data}
  catch(e){ // try cached month calendars
    const[y,m,d]=k.split('-').map(Number);const c=LS.get('c.cal.'+y+'-'+m+locKey(),null);
    if(c&&c.data[d-1]){G.online=false;return c.data[d-1]}
    throw e;
  }
}
async function getMonth(y,m){
  const path=(byAddr()?'calendarByAddress/':'calendar/')+y+'/'+m;
  const r=await api(path,locParams(),'cal.'+y+'-'+m+locKey());
  return r.data;
}
async function getNextApi(k){
  const path=(byAddr()?'nextPrayerByAddress/':'nextPrayer/')+keyToApi(k);
  const r=await api(path,locParams(),'next.'+k+locKey());
  const keys=Object.keys(r.data.timings||{});
  return keys.length?{name:keys[0],time:hm(r.data.timings[keys[0]]),fresh:r.fresh}:null;
}
function cachedUntil(){
  let last=null;const now=tzNow();
  for(let i=0;i<3;i++){let y=now.y,m=now.m+i;if(m>12){m-=12;y++}
    const c=LS.get('c.cal.'+y+'-'+m+locKey(),null);if(c&&c.data.length){const d=c.data[c.data.length-1].date.gregorian;last=`${+d.day} ${GM[d.month.number-1]}`}}
  return last;
}
async function loadAll(){
  const now=tzNow();
  G.day=await getDay(now.key);
  getDay(addDays(now.key,1)).then(d=>{G.tomorrow=d}).catch(()=>{});
  if(!OFFSET)getNextApi(now.key).then(n=>{G.next=n;refresh()}).catch(()=>{});
  // prefetch this + next month for offline
  let ny=now.y,nm=now.m+1;if(nm>12){nm=1;ny++}
  getMonth(now.y,now.m).then(d=>{G.month[now.y+'-'+now.m]=d;if(R.name==='home'&&!document.getElementById('wdt')?.querySelector('span:nth-of-type(2)'))refresh()}).catch(()=>{}).finally(()=>getMonth(ny,nm).catch(()=>{}).finally(()=>{G.cachedUntil=cachedUntil()}));
}

/* ============ prayer state ============ */
function state(){
  const now=tzNow();const d=G.day;if(!d)return null;
  const T=d.timings;let nxt=null;
  for(const p of PR){if(toSec(T[p])>now.secs){nxt={p,t:hm(T[p]),secs:toSec(T[p])-now.secs};break}}
  if(!nxt){const tm=G.tomorrow?G.tomorrow.timings.Fajr:T.Fajr;nxt={p:'Fajr',t:hm(tm),secs:86400-now.secs+toSec(tm),tomorrow:true}}
  // prefer nextPrayerByAddress answer when it agrees with the real clock
  if(G.next&&!OFFSET&&G.next.name!==nxt.p&&PR.includes(G.next.name)){/* trust local clock in location tz; API answer kept in log */}
  const passed=PR.filter(p=>toSec(T[p])<=now.secs);
  const night=now.secs>=toSec(T.Maghrib)||now.secs<toSec(T.Fajr);
  return {now,nxt,passed,night,T};
}

/* 06 / 07 qibla */
G.qibla=null;G.heading=0;G.hasSensor=false;
function locLatLng(){
  const l=S.loc;if(!l)return null;
  if(l.lat!=null)return [l.lat,l.lng];
  const m=G.day&&G.day.meta;if(m&&Math.abs(m.latitude-8.8888888)>1e-4)return [m.latitude,m.longitude];
  return null;
}
function qiblaDeg(){if(G.qibla!=null)return G.qibla;const ll=locLatLng();if(!ll)return null;return bearing(ll,KAABA)}
function bearing([a,b],[c,d]){const r=Math.PI/180;const y=Math.sin((d-b)*r)*Math.cos(c*r);const x=Math.cos(a*r)*Math.sin(c*r)-Math.sin(a*r)*Math.cos(c*r)*Math.cos((d-b)*r);return (Math.atan2(y,x)/r+360)%360}
function dist([a,b],[c,d]){const r=Math.PI/180;const h=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 6371*2*Math.asin(Math.sqrt(h))}
async function ensureQibla(){
  const ll=locLatLng();if(!ll)return;
  try{const r=await api(`qibla/${ll[0]}/${ll[1]}`,{},'qibla.'+ll.join(','));G.qibla=r.data.direction;if(R.name==='qibla')updDial()}catch(e){}
}
function dialSVG(){
  let t='';for(let a=0;a<360;a+=5){const L=a%30===0?14:a%10===0?9:6;const w=a%30===0?2.4:1.2;t+=`<line x1="150" y1="${16}" x2="150" y2="${16+L}" stroke="${a%90===0?'#fff':'#8796b3'}" stroke-width="${w}" transform="rotate(${a} 150 150)"/>`}
  const lab={0:'ش',90:'ق',180:'ج',270:'غ'};let n='';
  for(let a=0;a<360;a+=30){const r=a%90===0?104:112;const x=150+r*Math.sin(a*Math.PI/180),y=150-r*Math.cos(a*Math.PI/180);
    n+=a%90===0?`<text x="${x}" y="${y+7}" text-anchor="middle" font-size="20" font-weight="700" fill="${a===0?'#aebccc':'#fff'}" font-family="IBM Plex Sans Arabic">${lab[a]}</text>`:`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="10" fill="#8796b3" font-family="Inter" transform="rotate(${a} ${x} ${y})">${a}</text>`}

AFTER.qibla=()=>{
  if(qiblaDeg()==null)return;
  ensureQibla();
  let got=false;
  const h=e=>{let hd=null;if(e.webkitCompassHeading!=null)hd=e.webkitCompassHeading;else if(e.absolute&&e.alpha!=null)hd=360-e.alpha;else if(e.alpha!=null&&e.type==='deviceorientationabsolute')hd=360-e.alpha;
    if(hd==null)return;got=true;G.hasSensor=true;const so=screen.orientation?screen.orientation.angle||0:0;G.heading=(hd+so+360)%360;updDial()};
  const evn='ondeviceorientationabsolute' in window?'deviceorientationabsolute':'deviceorientation';
  const start=()=>{window.addEventListener(evn,h,true);cleanups.push(()=>window.removeEventListener(evn,h,true))};
  const box=document.getElementById('sensorbox');
  if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){
    box.innerHTML=`<div style="padding:10px 16px 0"><button class="btn gold" id="perm">${I('compass')} تفعيل البوصلة</button></div>`;
    document.getElementById('perm').onclick=()=>DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted'){start();box.innerHTML=''}else toast('تم رفض إذن البوصلة')}).catch(()=>{});
  }else start();
  const tm=setTimeout(()=>{if(!got){box.innerHTML=`<div class="simbar">${I('flask','18')}<span>لا توجد بوصلة في هذا الجهاز — جرّب بالسحب:</span><input type="range" min="0" max="359" value="${Math.round(G.heading)}" id="sim"></div>`;
    document.getElementById('sim').oninput=e=>{G.heading=+e.target.value;updDial()}}},1500);
  cleanups.push(()=>clearTimeout(tm));
  // drag on dial to simulate
  const dw=document.getElementById('dw');let drag=null;
  dw.onpointerdown=e=>{if(G.hasSensor)return;drag={x:e.clientX,h:G.heading};dw.setPointerCapture(e.pointerId)};
  dw.onpointermove=e=>{if(!drag)return;G.heading=((drag.h-(e.clientX-drag.x)*0.6)%360+360)%360;updDial();const s=document.getElementById('sim');if(s)s.value=Math.round(G.heading)};
  dw.onpointerup=()=>drag=null;
  updDial();
};
let wasOk=false;
function updDial(){
  const q=qiblaDeg();const rot=document.getElementById('drot');if(!rot||q==null)return;
  rot.setAttribute('transform',`rotate(${-G.heading} 150 150)`);
  document.getElementById('needle').setAttribute('transform',`rotate(${q} 150 150)`);
  const diff=((q-G.heading+540)%360)-180;const ok=Math.abs(diff)<=4;
  const qh=document.getElementById('qh');qh.className='qhead'+(ok?' ok':'');
  qh.querySelector('h3').textContent=ok?'أنت باتجاه القبلة':`أدِر هاتفك ${diff>0?'يميناً':'يساراً'} ${Math.round(Math.abs(diff))}°`;
  qh.querySelector('p').textContent=ok?'ثبّت الهاتف واستقبل القبلة':'ضع الهاتف أفقياً بعيداً عن المعادن';
  document.getElementById('dw').className='dialwrap'+(ok?' ok':'');
  const ring=document.getElementById('dring');ring.setAttribute('stroke',ok?'#3dbb8a':'#2b3c5c');ring.setAttribute('stroke-width',ok?'6':'2');
  document.getElementById('qline').innerHTML=`اتجاهك <span class="num">${Math.round(G.heading)}°</span> · القبلة <span class="num">${q.toFixed(1)}°</span>`;
  if(ok&&!wasOk&&navigator.vibrate)navigator.vibrate(60);wasOk=ok;
}

function playAdhan(){
  stopSound();

    const ctx=new (window.AudioContext||window.webkitAudioContext)();AUD={ctx,stop:false};
    const notes=S.sound==='short'?[[659,0],[880,.35]]:S.sound==='classic'?[[392,0],[440,.5],[494,1],[440,1.6],[392,2.2],[349,2.8],[392,3.4]]:[[523,0],[587,.7],[659,1.4],[587,2.2],[523,3]];
    const len=S.sound==='short'?1.2:4.4;
    const loop=(t0)=>{if(!AUD||AUD.stop)return;notes.forEach(([f,t])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+t);g.gain.linearRampToValueAtTime(.18,t0+t+.05);g.gain.exponentialRampToValueAtTime(.001,t0+t+1.4);o.connect(g);g.connect(ctx.destination);o.start(t0+t);o.stop(t0+t+1.5)});
      if(S.sound!=='short')AUD.tm=setTimeout(()=>loop(ctx.currentTime+.05),len*1000)};
    loop(ctx.currentTime+.05);
    if(navigator.vibrate)navigator.vibrate([200,100,200]);
  }catch(e){}

function count(e){

SCREENS.notifs=()=>{
  const k=tzNow().key;const T=G.day?G.day.timings:{};
  return `<div class="pt light" style="flex:1;display:flex;flex-direction:column;min-height:0">
  <div class="hdr"><button class="ib" onclick="back()">${I('arrowR')}</button><h1>تنبيهات كل صلاة</h1></div><div class="scroll">
  ${PR.map(p=>{const n=S.notif[p];return `<div class="card ncard ${n.on?'':'off'}">
   <div class="top"><span class="ib" style="background:#e9ecf0;border-radius:12px;color:#7d8597">${I(PIC[p],'20')}</span><span class="tx"><b>${pname(p,k)}</b><span>${hm(T[p])}</span></span><button class="tgl ${n.on?'on':''}" onclick="S.notif.${p}.on=!S.notif.${p}.on;save();askNotif();render()"></button></div>
   <div class="ops"><button class="o1" onclick="cyc('${p}','type')">${I(n.type==='short'?'bellf':'mega','16')} ${n.type==='fajr'&&p!=='Fajr'?TYPES.full:TYPES[n.type]}</button>
   <button class="o2" onclick="cyc('${p}','before')">${I('alarm','16')} ${n.before?`قبلها بـ ${n.before} د`:'بلا تنبيه مسبق'}</button>
   <button class="o3" onclick="cyc('${p}','after')">${I('tap','16')} ${n.after?`الأذكار بعد ${n.after} د`:'بلا تذكير أذكار'}</button></div>
   ${p==='Dhuhr'&&isFriday(k)?`<div class="nt">${I('info','14','color:#9aa0aa')} يوم الجمعة يتأخر تذكير الأذكار تلقائياً لانتهاء الخطبة والصلاة.</div>`:''}
  </div>`}).join('')}
  <p class="muted" style="font-size:11.5px;padding:0 20px 20px;line-height:1.8">اضغط على أي خيار لتغييره. في نسخة الويب تعمل التنبيهات ما دامت الصفحة مفتوحة؛ في تطبيق أندرويد تُجدول عبر النظام.</p>
  </div>${nav('settings')}</div>`;
};
function cyc(p,f){const n=S.notif[p];const o={type:p==='Fajr'?['fajr','full','short']:['full','short'],before:[0,5,10,15,20,30],after:[0,5,10,15,20,25,30,45]}[f];n[f]=o[(o.indexOf(n[f])+1)%o.length];save();render()}

/* ============ boot ============ */
function clock(){const n=tzNow();document.getElementById('sbt').textContent=`${pad(n.h)}:${pad(n.mi)}`}
setInterval(clock,1000);clock();
window.addEventListener('online',()=>{if(!FORCE_OFFLINE)loadAll().then(refresh).catch(()=>{})});
window.addEventListener('offline',()=>{G.online=false;refresh()});
if(S.loc){OB.method=S.method;OB.school=S.school}
render();
</script>
</body>
</html>
